server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads travel through this proxy since the frontend moved to a
    # same-origin /v0 API base, so nginx's 1 MB default now caps them and
    # returns its own 413 HTML page. Stay above the application's own limit
    # (400 MB under the local profile, advertised by /v0/config) so that an
    # oversized file is rejected by the API, with a JSON message the UI can
    # show, rather than by nginx.
    client_max_body_size 512m;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend. The frontend uses /v0 as its
    # same-origin production API base.
    location /v0/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the body straight to the backend. Buffering a 400 MB upload
        # would first spool it onto this container's writable layer, which is
        # exactly the ephemeral storage the S3 migration moved video data off.
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # A large upload over a slow link outlives the 60 s defaults.
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Keep the legacy path available for clients that still use it.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health check
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
